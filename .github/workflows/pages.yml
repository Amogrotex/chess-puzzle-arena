name: Deploy web client to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build client (GitHub Pages base path)
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # Point the static site at a hosted API if you have one.
          # Leave empty to run the client in built-in offline/demo mode.
          VITE_API_BASE: ${{ vars.API_BASE_URL }}
        run: |
          npm run build --workspace client
          # SPA fallback: GitHub Pages serves 404.html for unknown routes
          cp client/dist/index.html client/dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
